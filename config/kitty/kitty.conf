# kitty — Catppuccin Mocha

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0.5
cursor_stop_blinking_after 15

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# ── Mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait 2.0
copy_on_select  no

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width    12
window_border_width     2pt
placement_strategy      center
hide_window_decorations no
background_opacity      0.95
dynamic_background_color no

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      " {title[:20]} "

# ── Catppuccin Mocha ──────────────────────────────────────────────────────────
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E

url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# black
color0  #45475A
color8  #585B70

# red
color1  #F38BA8
color9  #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

# ── Key mappings ──────────────────────────────────────────────────────────────
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
map ctrl+shift+t  new_tab_with_cwd
map ctrl+shift+w  close_tab
map ctrl+shift+l  next_tab
map ctrl+shift+h  previous_tab
map ctrl+shift+r  set_tab_title
map ctrl+equal    increase_font_size
map ctrl+minus    decrease_font_size
map ctrl+0        restore_font_size

# ── Shell integration ─────────────────────────────────────────────────────────
shell_integration enabled
