# =============================================================================
#  Starship — Catppuccin Mocha
# =============================================================================

format = """
[](surface0)\
$os\
$username\
[](bg:surface1 fg:surface0)\
$directory\
[](fg:surface1 bg:surface2)\
$git_branch\
$git_status\
[](fg:surface2 bg:overlay0)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$python\
[](fg:overlay0 bg:blue)\
$docker_context\
[](fg:blue bg:mauve)\
$time\
[ ](fg:mauve)\
$line_break$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Arch = " "

[username]
show_always = true
style_user  = "bg:surface0 fg:text"
style_root  = "bg:surface0 fg:red"
format      = '[$user ]($style)'
disabled    = false

[directory]
style            = "fg:mantle bg:surface1"
format           = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style  = "bg:surface2"
format = '[[ $symbol $branch ](fg:text bg:surface2)]($style)'

[git_status]
style  = "bg:surface2"
format = '[[($all_status$ahead_behind )](fg:text bg:surface2)]($style)'

[nodejs]
symbol = ""
style  = "bg:overlay0"
format = '[[ $symbol ($version) ](fg:text bg:overlay0)]($style)'

[python]
symbol   = ""
style    = "bg:overlay0"
format   = '[[ $symbol ($version) ](fg:text bg:overlay0)]($style)'

[rust]
symbol = ""
style  = "bg:overlay0"
format = '[[ $symbol ($version) ](fg:text bg:overlay0)]($style)'

[golang]
symbol = ""
style  = "bg:overlay0"
format = '[[ $symbol ($version) ](fg:text bg:overlay0)]($style)'

[docker_context]
symbol = ""
style  = "bg:blue"
format = '[[ $symbol $context ](fg:mantle bg:blue)]($style)'

[time]
disabled    = false
time_format = "%H:%M"
style       = "bg:mauve"
format      = '[[  $time ](fg:mantle bg:mauve)]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
