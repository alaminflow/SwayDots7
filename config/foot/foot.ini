# =============================================================================
#  Foot Terminal — Catppuccin Mocha
# =============================================================================

[main]
term=foot
font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
pad=8x8
notify=notify-send -a ${app-id} -i ${app-id} ${title} ${body}

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+r

[search-bindings]
find-prev=Shift+Return
find-next=Return
cursor-left=Left Control+b
cursor-left-word=Control+Left Mod1+b
cursor-right=Right Control+f
cursor-right-word=Control+Right Mod1+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace
delete-prev-word=Mod1+BackSpace Control+BackSpace
delete-next=Delete
delete-next-word=Mod1+d Control+Delete
extend-to-word-boundary=Control+w
extend-to-next-whitespace=Control+Shift+w
clipboard-paste=Control+v Control+Shift+v
cancel=Escape Control+g Control+c
commit=Return

# ── Catppuccin Mocha ──────────────────────────────────────────────────────────
[colors]
alpha=0.95
background=1e1e2e
foreground=cdd6f4

# Regular
regular0=45475a   # surface1 (black)
regular1=f38ba8   # red
regular2=a6e3a1   # green
regular3=f9e2af   # yellow
regular4=89b4fa   # blue
regular5=f5c2e7   # pink
regular6=94e2d5   # teal
regular7=bac2de   # subtext1 (white)

# Bright
bright0=585b70    # surface2
bright1=f38ba8    # red
bright2=a6e3a1    # green
bright3=f9e2af    # yellow
bright4=89b4fa    # blue
bright5=f5c2e7    # pink
bright6=94e2d5    # teal
bright7=a6adc8    # subtext0

# Selection
selection-foreground=cdd6f4
selection-background=414356
