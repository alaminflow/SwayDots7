# yazi — Catppuccin Mocha theme

[manager]
cwd = { fg = "#89b4fa" }

hovered         = { fg = "#1e1e2e", bg = "#cba6f7" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "reset", bold = true, italic = true }

marker_copied  = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut     = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked  = { fg = "#cba6f7", bg = "#cba6f7" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

tab_active   = { fg = "#1e1e2e", bg = "#cba6f7" }
tab_inactive = { fg = "#cdd6f4", bg = "#45475a" }
tab_width    = 1

count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#89b4fa" }

border_symbol = "│"
border_style  = { fg = "#585b70" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#45475a", bg = "#45475a" }

mode_normal  = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
mode_select  = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
mode_unset   = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#45475a" }
progress_error  = { fg = "#f38ba8", bg = "#45475a" }

permissions_t = { fg = "#89b4fa" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#a6e3a1" }
permissions_s = { fg = "#585b70" }

[input]
border   = { fg = "#89b4fa" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#89b4fa" }
active   = { bg = "#313244" }
inactive = {}

[tasks]
border  = { fg = "#89b4fa" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#1e1e2e" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#cba6f7" }
run     = { fg = "#94e2d5" }
desc    = { fg = "#9399b2" }
hovered = { bg = "#313244", bold = true }
footer  = { fg = "#45475a", bg = "#cdd6f4" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#94e2d5" },
  # Video / audio
  { mime = "video/*", fg = "#f5c2e7" },
  { mime = "audio/*", fg = "#f5c2e7" },
  # Archives
  { mime = "application/zip",             fg = "#f9e2af" },
  { mime = "application/gzip",            fg = "#f9e2af" },
  { mime = "application/x-tar",           fg = "#f9e2af" },
  { mime = "application/x-7z-compressed", fg = "#f9e2af" },
  # Documents
  { mime = "application/pdf",  fg = "#f38ba8" },
  { mime = "application/doc",  fg = "#89b4fa" },
  { mime = "application/docx", fg = "#89b4fa" },
  # Folders
  { name = "*/", fg = "#89b4fa" },
  # Fallback
  { name = "*", fg = "#cdd6f4" },
]
