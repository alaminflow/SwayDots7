# =============================================================================
#  Tmux Configuration — Catppuccin Mocha
# =============================================================================

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal   "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc,xterm-256color:Tc"
set -g base-index          1
set -g pane-base-index     1
set -g history-limit       50000
set -g mouse               on
set -sg escape-time         10
set -sg focus-events        on
set -g renumber-windows    on
set -g set-titles          on
set -g set-titles-string   "#S:#W"
set -g allow-passthrough   on

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind  C-a send-prefix

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file "#{HOME}/.tmux.conf" \; display "Config reloaded!"

# ── Pane splitting (current path) ─────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (vim-style) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize ───────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ─────────────────────────────────────────────────────────
bind -n M-H previous-window
bind -n M-L next-window
bind Tab last-window

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line

# ── Catppuccin Mocha colours ──────────────────────────────────────────────────
set -g @ctp_bg      "#1e1e2e"
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"
set -g @ctp_text    "#cdd6f4"
set -g @ctp_subtext "#a6adc8"
set -g @ctp_mauve   "#cba6f7"
set -g @ctp_blue    "#89b4fa"
set -g @ctp_green   "#a6e3a1"
set -g @ctp_red     "#f38ba8"
set -g @ctp_yellow  "#f9e2af"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status                "on"
set -g status-position       "bottom"
set -g status-interval       5
set -g status-style          "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-length    80
set -g status-right-length   150

set -g status-left  "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e]"
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#a6adc8,bg=#313244]  %H:%M #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] %d %b "

set -g window-status-format         "#[fg=#1e1e2e,bg=#313244] #I #[fg=#a6adc8,bg=#313244]#W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa] #I #[fg=#1e1e2e,bg=#89b4fa,bold]#W #[fg=#89b4fa,bg=#1e1e2e]"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# ── Message style ─────────────────────────────────────────────────────────────
set -g message-style       "fg=#f9e2af,bg=#1e1e2e,bold"
set -g message-command-style "fg=#f9e2af,bg=#1e1e2e,bold"

# ── Mode style (copy) ─────────────────────────────────────────────────────────
set -g mode-style "fg=#1e1e2e,bg=#cba6f7"
